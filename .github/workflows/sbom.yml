name: SBOM + vulnerability scan
# Generate and scan a CycloneDX SBOM on every branch/tag push. Tagged versions
# are also published to Dependency-Track (projectVersion = tag name).
on:
  push: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate + scan + publish tagged SBOM
    # GitHub-only: the file lives under .github/ but Forgejo (GHES) also runs
    # these workflows. This gate keeps publishing on GitHub only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (CycloneDX, cdxgen)
        # Pin the CycloneDX spec version: cdxgen defaults to the newest (1.7),
        # which this Dependency-Track server rejects. 1.6 is supported by DT >= 4.11.
        run: npx --yes @cyclonedx/cdxgen@latest -o bom.json --spec-version 1.6

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: bom.json

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - id: grype
        name: Scan SBOM with Grype
        continue-on-error: true
        run: grype sbom:bom.json --fail-on high

      - name: Publish to Dependency-Track
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          PROJECT_VERSION: ${{ github.ref_name }}
        run: |
          code=$(curl -sS -o resp.json -w '%{http_code}' \
            -X POST https://dtrack.k8s.adnt.io/api/v1/bom \
            -H "X-Api-Key: $DTRACK_API_KEY" \
            -F "autoCreate=true" \
            -F "projectName=$PROJECT_NAME" \
            -F "projectVersion=$PROJECT_VERSION" \
            -F "bom=@bom.json")
          echo "Dependency-Track HTTP $code — project $PROJECT_NAME@$PROJECT_VERSION"
          case "$code" in
            2*)  echo "✅ SBOM published (Components tab should populate)." ;;
            401) echo "::error::401 — DTRACK_API_KEY lacks a permission: BOM_UPLOAD (upload) and/or PROJECT_CREATION_UPLOAD (needed by autoCreate for a new project/version)."; cat resp.json; exit 1 ;;
            404) echo "::error::404 project — check autoCreate=true + PROJECT_CREATION_UPLOAD on the server."; cat resp.json; exit 1 ;;
            *)   echo "::error::Dependency-Track upload failed (HTTP $code)."; cat resp.json; exit 1 ;;
          esac

      - name: Fail on high vulnerabilities
        if: steps.grype.outcome == 'failure'
        run: exit 1
